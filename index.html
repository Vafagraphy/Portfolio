<!DOCTYPE html>
<!-- نوع سند را HTML5 اعلام می‌کند -->
<html lang="fa" dir="rtl" data-theme="light">
<!-- زبان پیش‌فرض فارسی و جهت صفحه راست‌به‌چپ است؛ جاوااسکریپت هنگام تغییر زبان این دو مقدار را عوض می‌کند -->
<head>
  <!-- شروع بخش اطلاعات فنی صفحه (دیده نمی‌شود) -->
  <meta charset="utf-8">
  <!-- کدگذاری UTF-8 برای نمایش درست حروف فارسی -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- برای نمایش درست در موبایل: عرض صفحه برابر عرض دستگاه -->
  <title>نمونه‌کار — نام شما</title>
  <!-- عنوان تب مرورگر؛ هنگام تغییر زبان از داخل جاوااسکریپت (آبجکت UI) عوض می‌شود -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- اتصال زودهنگام به سرور فونت گوگل برای سرعت بیشتر -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- اتصال زودهنگام به سرور فایل‌های فونت -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- فونت‌ها: وزیرمتن برای فارسی، و Syne / Instrument Sans / JetBrains Mono برای انگلیسی -->

  <style>
    /* ═════════ شروع استایل‌ها (CSS) ═════════ */

    /* ───── متغیرهای رنگ و فونت (برای تغییر ظاهر کل سایت همین‌جا را ویرایش کنید) ───── */
    :root {
      --bg: #F3EFE6; --bg2: #E9E4D6; --surface: #FBF9F4;            /* رنگ پس‌زمینه اصلی، پس‌زمینه دوم و رنگ کارت‌ها */
      --ink: #14130F; --muted: #55504A; --line: rgba(20,19,15,.16); /* رنگ متن اصلی، متن کم‌رنگ و رنگ خط‌های جداکننده */
      --accent: #E8502E; --accent-ink: #B2321A; --on-accent: #14130F; /* رنگ تاکیدی (نارنجی)، نسخه تیره‌ترش و رنگ متن روی آن */
      --blue: #3347D9;                                               /* رنگ آبی تزئینی */
      --shadow: 0 1px 0 rgba(20,19,15,.05), 0 22px 44px -22px rgba(20,19,15,.32); /* سایه کارت‌ها */
    }
    html[data-theme="dark"] {                                        /* وقتی تم تیره فعال است، همین متغیرها مقدار دیگری می‌گیرند */
      --bg: #0D0F15; --bg2: #12151D; --surface: #171A24;             /* پس‌زمینه‌های تیره */
      --ink: #F1EDE3; --muted: #A9AAA6; --line: rgba(241,237,227,.16); /* متن و خطوط روشن */
      --accent: #FF6A45; --accent-ink: #FF8D6F;                      /* تاکیدی روشن‌تر برای خوانایی روی تیره */
      --blue: #8896FF;                                               /* آبی روشن‌تر */
      --shadow: 0 1px 0 rgba(255,255,255,.04), 0 24px 48px -24px rgba(0,0,0,.8); /* سایه عمیق‌تر */
    }
    html[lang="fa"] {                                                /* فونت‌ها وقتی زبان فارسی است */
      --display: 'Vazirmatn', Tahoma, system-ui, sans-serif;         /* فونت تیترها */
      --body: 'Vazirmatn', Tahoma, system-ui, sans-serif;            /* فونت متن عادی */
      --mono: 'Vazirmatn', Tahoma, monospace;                        /* فونت برچسب‌های ریز */
    }
    html[lang="en"] {                                                /* فونت‌ها وقتی زبان انگلیسی است */
      --display: 'Syne', 'Arial Black', system-ui, sans-serif;       /* فونت تیترها */
      --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; /* فونت متن */
      --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;      /* فونت برچسب‌ها */
    }
    html[lang="fa"] * { letter-spacing: 0 !important; text-transform: none !important; } /* در فارسی فاصله بین حروف و حروف بزرگ نباید اعمال شود (حروف فارسی به هم می‌چسبند) */

    /* ───── تنظیمات پایه ───── */
    *, *::before, *::after { box-sizing: border-box; }               /* padding و border داخل عرض/ارتفاع حساب شوند */
    html { scroll-behavior: smooth; }                                /* اسکرول نرم هنگام کلیک روی لینک‌های داخلی */
    body { margin: 0; font-family: var(--body); font-size: 17px; line-height: 1.6; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; transition: background-color .45s, color .45s; } /* حاشیه صفر، فونت، اندازه، رنگ‌ها و انیمیشن تغییر تم */
    html[lang="fa"] body { line-height: 1.9; }                       /* فاصله خطوط فارسی بیشتر باشد تا خوانا بماند */
    a { color: inherit; text-decoration: none; }                     /* لینک‌ها رنگ متن اطراف را بگیرند و خط زیر نداشته باشند */
    h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }             /* حذف فاصله‌های پیش‌فرض مرورگر */
    ul { list-style: none; }                                         /* حذف نقطه‌های لیست */
    button { font: inherit; color: inherit; cursor: pointer; }       /* دکمه‌ها فونت و رنگ متن اطراف را بگیرند */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; } /* خط دور المان هنگام ناوبری با کیبورد */
    svg { display: block; direction: ltr; }                          /* آیکون‌ها بلوکی شوند و جهتشان چپ‌به‌راست بماند */
    [hidden] { display: none !important; }                           /* المانی که hidden دارد حتماً مخفی شود */

    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); } /* ظرف مرکزی با حداکثر عرض و حاشیه‌های واکنش‌گرا */
    .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 12px; align-items: center; } /* برچسب کوچک بالای تیتر */
    .eyebrow b { font-weight: 500; color: var(--accent-ink); }       /* شماره بخش با رنگ تاکیدی */
    .ph { border-bottom: 1px dashed var(--accent-ink); }             /* متن‌های جایگزین [کروشه‌ای] با خط‌چین مشخص می‌شوند؛ کلاس ph را از متن واقعی خود بردارید */
    .h2 { font-family: var(--display); font-weight: 700; font-size: clamp(2.1rem, 5vw, 3.6rem); line-height: 1.05; letter-spacing: -.025em; text-wrap: balance; } /* تیترهای بزرگ بخش‌ها */
    html[lang="fa"] .h2, html[lang="fa"] .hero h1 { line-height: 1.4; } /* تیتر فارسی فاصله خط بیشتری می‌خواهد */
    .skip { position: absolute; inset-inline-start: 12px; top: -80px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 100; transition: top .2s; } /* لینک «پرش به محتوا» ابتدا بیرون صفحه است */
    .skip:focus { top: 12px; }                                       /* با فوکوس کیبورد وارد صفحه می‌شود */
    .arr { display: inline-block; }                                  /* فلش‌های متنی قابل چرخش باشند */
    html[dir="rtl"] .arr, html[dir="rtl"] .flip { transform: scaleX(-1); } /* در حالت راست‌به‌چپ فلش‌ها برعکس می‌شوند */

    /* ───── دکمه‌ها ───── */
    .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 600; font-size: 15px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); transition: transform .25s, background-color .25s, color .25s, border-color .25s; } /* دکمه گرد توخالی */
    .btn:hover { transform: translateY(-2px); background: var(--ink); color: var(--bg); } /* هاور: کمی بالا می‌رود و رنگ‌ها وارونه می‌شوند */
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); } /* دکمه اصلی با رنگ تاکیدی */
    .btn-primary:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); } /* هاور دکمه اصلی */
    .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; } /* استایل همه آیکون‌های خطی */
    .btn .ic { width: 18px; height: 18px; }                          /* آیکون داخل دکمه کمی کوچک‌تر */

    /* ───── هدر (نوار بالا) ───── */
    .hdr { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); } /* هدر چسبیده به بالا با پس‌زمینه شیشه‌ای */
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; padding-top: env(safe-area-inset-top, 0px); } /* ردیف هدر: لوگو در یک سو، ابزارها در سوی دیگر */
    .logo { display: flex; align-items: center; gap: 12px; }          /* لوگو + نام کنار هم */
    .logo svg { width: 38px; height: 38px; transition: transform .5s cubic-bezier(.2,.8,.2,1); } /* اندازه آیکون لوگو و انیمیشن */
    .logo:hover svg { transform: rotate(-12deg) scale(1.06); }       /* هاور: کمی می‌چرخد */
    .logo-name { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.2; display: block; } /* نام شما در هدر */
    .logo-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; } /* زیرنویس کوچک زیر نام */
    .tools { display: flex; align-items: center; gap: 8px; }         /* گروه منو و دکمه‌ها */
    .nav { display: flex; align-items: center; gap: 4px; }           /* منوی اصلی در دسکتاپ */
    .nav a { position: relative; padding: 10px 14px; font-weight: 500; font-size: 15px; } /* هر لینک منو */
    .nav a::after { content: ''; position: absolute; inset-inline: 14px; bottom: 5px; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .3s; } /* خط زیرین که با هاور باز می‌شود */
    html[dir="rtl"] .nav a::after { transform-origin: right; }       /* در راست‌به‌چپ خط از سمت راست باز شود */
    .nav a:hover::after, .nav a:focus-visible::after { transform: scaleX(1); } /* نمایش کامل خط هنگام هاور */
    .icon-btn { min-width: 46px; height: 46px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; transition: border-color .25s, transform .25s; } /* دکمه‌های گرد هدر (تم، منو، زبان) */
    .icon-btn:hover { border-color: var(--ink); transform: rotate(14deg); } /* هاور: کمی کج می‌شود */
    .lang-btn { padding: 0 14px; gap: 8px; font-family: var(--mono); font-size: 13px; font-weight: 600; } /* دکمه تغییر زبان کمی عریض‌تر است چون متن دارد */
    .lang-btn:hover { transform: none; }                              /* دکمه زبان نچرخد */
    html[data-theme="light"] .i-sun { display: none; }               /* در تم روشن آیکون خورشید مخفی است */
    html[data-theme="dark"] .i-moon { display: none; }               /* در تم تیره آیکون ماه مخفی است */
    .menu-btn { display: none; }                                      /* دکمه منوی همبرگری فقط در موبایل */
    .menu-btn[aria-expanded="true"] .i-menu { display: none; }       /* وقتی منو باز است آیکون همبرگر مخفی شود */
    .menu-btn:not([aria-expanded="true"]) .i-x { display: none; }    /* وقتی بسته است آیکون ضربدر مخفی شود */
    @media (max-width: 819px) {                                       /* ── استایل موبایل و تبلت ── */
      .menu-btn { display: inline-flex; }                             /* نمایش دکمه منو */
      .nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 0; padding: 8px clamp(16px, 4vw, 48px) 20px; background: var(--bg); border-bottom: 1px solid var(--line); } /* منو به صورت کشویی زیر هدر */
      .nav[data-open="true"] { display: flex; }                       /* با باز شدن منو نمایش داده شود */
      .nav a { padding: 16px 4px; font-size: 20px; font-family: var(--display); font-weight: 700; border-top: 1px solid var(--line); min-height: 52px; } /* لینک‌های بزرگ‌تر در موبایل */
      .nav a::after { display: none; }                                /* خط زیرین در موبایل لازم نیست */
      .logo-sub { display: none; }                                    /* زیرنویس لوگو در موبایل مخفی شود تا جا باشد */
    }

    /* ───── بخش اصلی صفحه (Hero) ───── */
    .hero { padding: clamp(28px, 5vw, 64px) 0 clamp(40px, 6vw, 80px); } /* فاصله بالا و پایین */
    .hero-grid { display: grid; gap: clamp(28px, 4vw, 64px); grid-template-columns: minmax(0, 1fr); align-items: center; } /* در موبایل یک ستون */
    @media (min-width: 960px) { .hero-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } } /* در دسکتاپ دو ستون: متن و تصویر */
    .hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 5.6vw, 4.2rem); line-height: 1.05; letter-spacing: -.035em; margin: 22px 0 24px; } /* تیتر اصلی */
    .hero h1 span { display: block; }                                 /* هر خط تیتر در یک سطر */
    .cut-word { color: var(--accent-ink); text-decoration: underline dashed var(--accent); text-decoration-thickness: 3px; text-underline-offset: .15em; } /* کلمه «برش» با خط‌چین */
    .lede { max-width: 46ch; color: var(--muted); font-size: 1.1rem; } /* پاراگراف معرفی */
    .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; } /* ردیف دکمه‌ها */
    .disc-list { margin-top: 44px; border-top: 1px solid var(--line); } /* لیست رشته‌ها زیر دکمه‌ها */
    .disc { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; min-height: 52px; border-bottom: 1px solid var(--line); transition: padding .3s, color .25s; } /* هر ردیف: شماره، عنوان، فلش */
    .disc:hover, .disc:focus-visible { padding-inline-start: 10px; color: var(--accent-ink); } /* هاور: کمی جابه‌جا و رنگی */
    .disc .n { font-family: var(--mono); font-size: 12px; color: var(--muted); } /* شماره ردیف */
    .disc .t { font-family: var(--display); font-weight: 700; font-size: 1.05rem; } /* عنوان ردیف */
    .hero-art { width: 100%; max-width: 680px; justify-self: center; } /* قاب تصویر هیرو */
    .hero-art svg { width: 100%; height: auto; overflow: visible; }  /* تصویر هیرو واکنش‌گرا */
    .f-ink { fill: var(--ink); } .f-bg { fill: var(--bg); } .f-acc { fill: var(--accent); } .f-blue { fill: var(--blue); } .f-surface { fill: var(--surface); } /* کلاس‌های رنگ‌آمیزی SVG با متغیرهای تم */
    .s-line { stroke: var(--line); } .s-blue { stroke: var(--blue); } /* کلاس‌های رنگ خط SVG */
    .cutline { fill: none; stroke: var(--accent); stroke-width: 1.6; } /* خط برش لیزر */
    .grain { fill: none; stroke: #8C5F2E; stroke-width: 1.2; opacity: .3; } /* رگه‌های چوب */
    .spark { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 1.2 98.8; animation: run 6s linear infinite; } /* جرقه سفید لیزر که روی مسیر می‌دود */
    .layer { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; } /* هر لایه تصویر هیرو با انیمیشن ظاهر می‌شود */
    .l2 { animation-delay: .2s; } .l3 { animation-delay: .35s; } .l4 { animation-delay: .5s; } /* تاخیر ظاهر شدن لایه‌ها */
    .float { animation: floaty 7s ease-in-out infinite; }            /* شناور بودن مکعب */
    @keyframes run { to { stroke-dashoffset: -100; } }               /* حرکت جرقه */
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } } /* بالا و پایین رفتن */
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } } /* ظاهر شدن از پایین */
    @keyframes slide { to { transform: translateX(-50%); } }         /* حرکت نوار متحرک */
    @keyframes trace { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } } /* رسم شدن خط برش */

    /* ───── نوار متحرک ───── */
    .band { direction: ltr; border-block: 1px solid var(--line); overflow: hidden; background: var(--bg2); } /* جهت چپ‌به‌راست تا انیمیشن در RTL خراب نشود */
    .band-track { display: flex; width: max-content; animation: slide 38s linear infinite; } /* ریل متحرک */
    .band:hover .band-track { animation-play-state: paused; }        /* با هاور متوقف می‌شود */
    .band-set { display: flex; align-items: center; flex-shrink: 0; } /* یک دسته از کلمات */
    .band-item { font-family: var(--display); font-weight: 700; font-size: clamp(1.1rem, 2.4vw, 1.6rem); padding: 20px 0; white-space: nowrap; } /* هر کلمه */
    .band-dot { width: 10px; height: 10px; margin: 0 28px; background: var(--accent); border-radius: 50%; flex-shrink: 0; } /* نقطه بین کلمات */

    /* ───── بخش پروژه‌ها ───── */
    .section { padding: clamp(64px, 9vw, 120px) 0; scroll-margin-top: 72px; } /* فاصله هر بخش؛ scroll-margin برای جا ماندن زیر هدر */
    .proj-head { display: grid; gap: 20px; align-items: end; margin-bottom: 36px; } /* سربرگ بخش پروژه‌ها */
    @media (min-width: 900px) { .proj-head { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); } } /* دو ستون در دسکتاپ */
    .proj-note { color: var(--muted); max-width: 46ch; }              /* توضیح کوچک کنار تیتر */
    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; } /* ردیف دکمه‌های فیلتر */
    .chip { display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; transition: background-color .25s, color .25s, border-color .25s, transform .25s; } /* دکمه فیلتر */
    .chip .k { font-family: var(--mono); font-size: 11px; color: var(--muted); } /* شماره داخل دکمه فیلتر */
    .chip:hover { border-color: var(--ink); transform: translateY(-2px); } /* هاور فیلتر */
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); } /* فیلتر فعال */
    .chip[aria-pressed="true"] .k { color: var(--accent); }          /* شماره فیلتر فعال */
    .count { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 26px; min-height: 20px; } /* متن «نمایش X از Y» */
    /* ───── کارت‌های پروژه (شبکه یکدست و واکنش‌گرا) ───── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 24px; } /* ستون‌ها خودکار بر اساس عرض صفحه ساخته می‌شوند */
    .pcard { position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .3s; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; } /* خود کارت */
    .pcard:hover, .pcard:focus-within { transform: translateY(-5px); border-color: color-mix(in srgb, var(--ink) 45%, transparent); } /* هاور کارت */
    @media (min-width: 900px) { .pcard.feat { grid-column: span 2; } .pcard.feat .pc-cover { aspect-ratio: 16 / 9; } } /* پروژه ویژه (featured) دو برابر عرض می‌گیرد */
    .pc-open { position: absolute; inset: 0; z-index: 3; width: 100%; background: transparent; border: 0; border-radius: 20px; cursor: pointer; } /* دکمه نامرئی روی کل کارت؛ کلیک = باز شدن پنجره پروژه */
    .pc-cover { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--bg2); } /* قاب عکس روی کارت */
    .pc-cover img, .pc-cover video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s cubic-bezier(.2,.8,.2,1); } /* عکس بدون کشیدگی */
    .pcard:hover .pc-cover img, .pcard:hover .pc-cover video { transform: scale(1.05); } /* هاور: کمی زوم */
    .pc-ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff; font-family: var(--mono); font-size: 12px; } /* جای‌نگهدار وقتی عکسی نیست */
    .pc-ph .ic { width: 44px; height: 44px; stroke-width: 1.4; } /* آیکون بزرگ جای‌نگهدار */
    .t-images .pc-ph { background: linear-gradient(135deg, #E8502E, #E9B53D); } /* رنگ جای‌نگهدار گالری */
    .t-video .pc-ph { background: linear-gradient(135deg, #3347D9, #8896FF); } /* ویدیو */
    .t-model3d .pc-ph { background: linear-gradient(135deg, #0B0C12, #3A47D6); } /* سه‌بعدی */
    .t-video .pc-ph { justify-content: flex-end; padding-bottom: 20px; } .t-video .pc-ph .ic { display: none; } /* در ویدیو فقط دکمه پخش وسط می‌ماند */
    .t-compare .pc-ph, .t-laser .pc-ph { background: linear-gradient(135deg, #C79A5B, #E8502E); } /* قبل/بعد و لیزر */
    .t-code .pc-ph { background: linear-gradient(135deg, #12141C, #2B36B4); } /* نرم‌افزار */
    .t-embed .pc-ph { background: linear-gradient(135deg, #1C6B5A, #6EC38A); } /* نمایش زنده */
    .pc-type, .pc-sample { position: absolute; top: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; padding: 6px 10px; border-radius: 999px; background: rgba(20,19,15,.82); color: #F1EDE3; } /* برچسب‌های روی عکس */
    .pc-type { inset-inline-start: 12px; } /* برچسب نوع در یک گوشه */
    .pc-sample { inset-inline-end: 12px; background: var(--accent); color: #14130F; } /* برچسب «نمونه» در گوشه دیگر */
    .pc-type .ic { width: 14px; height: 14px; } /* آیکون کوچک نوع */
    .pc-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; } /* دکمه پخش روی ویدیوها */
    .pc-play span { width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(20,19,15,.7); color: #fff; transition: transform .3s, background-color .3s; } /* دایره پخش */
    .pc-play .ic { fill: currentColor; stroke: none; width: 24px; height: 24px; } /* مثلث پخش */
    .pcard:hover .pc-play span { transform: scale(1.1); background: var(--accent); } /* هاور: بزرگ و رنگی */
    .pc-body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 18px 20px 20px; border-top: 1px solid var(--line); } /* بخش متن کارت */
    .kind { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; } /* دسته‌بندی */
    .kind span { color: var(--accent-ink); } /* شماره دسته */
    .pc-body h3 { font-family: var(--display); font-weight: 700; font-size: 1.25rem; line-height: 1.4; } /* عنوان */
    .desc { color: var(--muted); font-size: 15px; } /* توضیح */
    .pc-body .desc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; } /* توضیح روی کارت حداکثر ۳ خط */
    .tags { display: flex; flex-wrap: wrap; gap: 8px; } /* ردیف برچسب‌ها */
    .tag { font-family: var(--mono); font-size: 11px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); } /* هر برچسب */

    /* ───── پنجره نمایش پروژه (Modal) ───── */
    .modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: clamp(8px, 3vw, 32px); } /* لایه تمام‌صفحه */
    .modal-back { position: absolute; inset: 0; background: rgba(8,9,13,.74); backdrop-filter: blur(6px); animation: fade .25s both; } /* پرده تیره پشت پنجره */
    .modal-box { position: relative; width: min(1180px, 100%); max-height: 100%; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; outline: none; animation: rise .35s both; } /* جعبه اصلی؛ موبایل: بالا نمایشگر، پایین اطلاعات */
    @media (min-width: 960px) { .modal-box { grid-template-columns: minmax(0, 1fr) 360px; } } /* دسکتاپ: نمایشگر + ستون اطلاعات */
    .m-close { position: fixed; top: 14px; inset-inline-end: 14px; z-index: 5; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: rgba(20,19,15,.85); color: #fff; } /* دکمه بستن */
    .m-view { min-width: 0; background: #0B0C12; color: #F1EDE3; display: flex; flex-direction: column; justify-content: center; } /* ناحیه نمایش رسانه */
    .m-empty { aspect-ratio: 4 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: #A9AEC4; } /* وقتی رسانه‌ای نیست */
    .m-empty .ic { width: 48px; height: 48px; stroke-width: 1.3; } /* آیکون */
    .gal { position: relative; direction: ltr; } /* گالری عکس (همیشه چپ‌به‌راست تا دکمه‌ها درست باشند) */
    .gal-main { position: relative; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; } /* قاب عکس بزرگ */
    .gal-main img { max-width: 100%; max-height: 100%; object-fit: contain; } /* کل عکس دیده شود */
    .gal-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: rgba(20,19,15,.72); color: #fff; } /* دکمه‌های قبلی/بعدی */
    .gal-btn.prev { left: 12px; } .gal-btn.next { right: 12px; } .gal-btn.prev .ic { transform: scaleX(-1); } /* جای دکمه‌ها و برعکس کردن فلش قبلی */
    .gal-count { position: absolute; bottom: 10px; left: 12px; font-family: var(--mono); font-size: 11px; padding: 4px 10px; border-radius: 999px; background: rgba(20,19,15,.72); } /* شماره عکس */
    .gal-thumbs { display: flex; gap: 8px; padding: 10px; overflow-x: auto; background: #12141C; } /* ردیف تصاویر کوچک */
    .gal-thumbs button { flex: 0 0 72px; height: 54px; padding: 0; overflow: hidden; border: 2px solid transparent; border-radius: 8px; background: none; opacity: .6; } /* هر تصویر کوچک */
    .gal-thumbs button.on { border-color: var(--accent); opacity: 1; } /* تصویر انتخاب‌شده */
    .gal-thumbs img { width: 100%; height: 100%; object-fit: cover; } /* تصویر کوچک */
    .vid { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; } /* ویدیو و iframe */
    .mv { position: relative; aspect-ratio: 4 / 3; background: radial-gradient(circle at 50% 35%, #2C3250, #0B0C12); } /* قاب مدل سه‌بعدی */
    .mv model-viewer { width: 100%; height: 100%; --poster-color: transparent; } /* خود مدل */
    .mv-hint { position: absolute; bottom: 12px; inset-inline: 12px; text-align: center; font-family: var(--mono); font-size: 11px; color: #A9AEC4; pointer-events: none; } /* راهنمای چرخاندن */
    .mv-fail { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: #0B0C12; color: #F1EDE3; } /* پیام خطا */
    .cmp { --p: 50%; position: relative; direction: ltr; aspect-ratio: 4 / 3; overflow: hidden; user-select: none; background: #0B0C12; } /* اسلایدر قبل/بعد؛ --p موقعیت خط جداکننده */
    .cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; } /* هر دو عکس روی هم */
    .cmp .cmp-b { clip-path: inset(0 calc(100% - var(--p)) 0 0); } /* عکس «قبل» فقط تا خط جداکننده دیده می‌شود */
    .cmp-line { position: absolute; top: 0; bottom: 0; left: var(--p); width: 2px; background: #fff; transform: translateX(-1px); box-shadow: 0 0 8px rgba(0,0,0,.5); pointer-events: none; } /* خط جداکننده */
    .cmp-line::after { content: ''; position: absolute; top: 50%; left: 50%; width: 36px; height: 36px; margin: -18px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; } /* دستگیره گرد */
    .cmp input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; } /* لغزنده نامرئی روی کل عکس (هم موس، هم لمس، هم کیبورد) */
    .cmp-lab { position: absolute; top: 12px; left: 12px; z-index: 2; font-family: var(--mono); font-size: 11px; padding: 6px 10px; border-radius: 999px; background: rgba(20,19,15,.82); color: #F1EDE3; pointer-events: none; } /* برچسب سمت چپ */
    .cmp-lab.r { left: auto; right: 12px; background: rgba(251,249,244,.92); color: #14130F; } /* برچسب سمت راست */
    .m-info { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: clamp(20px, 3vw, 32px); } /* ستون اطلاعات */
    .m-info h2 { font-family: var(--display); font-weight: 700; font-size: 1.7rem; line-height: 1.35; } /* عنوان پروژه */
    .m-info .desc { white-space: pre-line; font-size: 16px; } /* توضیح کامل؛ خط جدید در متن حفظ می‌شود */
    .m-det { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; padding: 14px 0; border-block: 1px dashed var(--line); font-size: 14.5px; } /* اطلاعات: نقش، سال، ابزار... */
    .m-det dt { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 3px; } /* عنوان هر اطلاعات */
    .m-links { display: flex; flex-wrap: wrap; gap: 10px; } /* دکمه‌های لینک */
    .m-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 10px; } /* قبلی/بعدی پروژه */
    .m-nav .btn { min-height: 42px; padding: 0 16px; font-size: 14px; } /* دکمه‌های کوچک‌تر */
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } } /* محو شدن پرده */
    /* کارت نرم‌افزار (پنجره کد) */
    .art-code { background: var(--bg2); padding: 20px; display: flex; flex-direction: column; gap: 14px; } /* پس‌زمینه ناحیه کد */
    .win { direction: ltr; background: #12141C; border-radius: 14px; color: #D7DAE6; overflow: hidden; flex: 1 1 auto; box-shadow: 0 18px 36px -20px rgba(0,0,0,.6); } /* پنجره شبیه ویرایشگر (کد همیشه چپ‌به‌راست است) */
    .win-bar { display: flex; align-items: center; gap: 7px; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.08); } /* نوار بالای پنجره */
    .win-bar i { width: 10px; height: 10px; border-radius: 50%; }    /* دایره‌های رنگی */
    .win-bar i:nth-child(1) { background: #FF6A45; } .win-bar i:nth-child(2) { background: #E9B53D; } .win-bar i:nth-child(3) { background: #6EC38A; } /* رنگ سه دایره */
    .win-bar span { margin-inline-start: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #9097B0; } /* نام فایل */
    .code { margin: 0; padding: 16px 0 18px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.75; white-space: normal; overflow-x: auto; counter-reset: ln; } /* بلوک کد */
    .cl { display: block; white-space: pre; padding-right: 18px; }   /* هر خط کد */
    .cl::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 2.4ch; margin: 0 1.6ch 0 14px; text-align: right; color: #8089A8; } /* شماره خط */
    .in1 { display: inline-block; padding-left: 2ch; } .in2 { display: inline-block; padding-left: 4ch; } /* تورفتگی خطوط */
    .ck { color: #8FA0FF; } .cf { color: #FFB86B; } .cc { color: #8A92AD; } .cn { color: #FF8D6F; } /* رنگ کلمه‌های کلیدی، تابع، کامنت و نوع */
    .stack { display: flex; flex-wrap: wrap; gap: 8px; }             /* ردیف برچسب‌های تکنولوژی */


    /* ───── بخش درباره من ───── */
    .about { background: var(--bg2); border-block: 1px solid var(--line); } /* پس‌زمینه متفاوت */
    .about-grid { display: grid; gap: clamp(32px, 5vw, 72px); grid-template-columns: minmax(0, 1fr); } /* موبایل: یک ستون */
    @media (min-width: 900px) { .about-grid { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); } } /* دسکتاپ: عکس و متن */
    .portrait { max-width: 420px; width: 100%; }                     /* قاب عکس شخصی */
    .portrait svg { width: 100%; height: auto; }                     /* عکس واکنش‌گرا */
    .portrait img { width: 100%; border-radius: 22px; }              /* اگر به‌جای SVG عکس واقعی گذاشتید */
    .about h2 { margin: 18px 0 26px; }                               /* فاصله تیتر درباره من */
    .about p { max-width: 62ch; color: var(--muted); font-size: 1.05rem; } /* متن معرفی */
    .about p + p { margin-top: 16px; }                               /* فاصله بین پاراگراف‌ها */
    .about p strong { color: var(--ink); font-weight: 600; }         /* نام پررنگ */
    .skills { display: grid; gap: 28px 24px; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); margin-top: 56px; } /* ستون‌های مهارت */
    .skills h3 { font-family: var(--display); font-weight: 700; font-size: 1.1rem; padding-bottom: 12px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; } /* عنوان هر دسته مهارت */
    .skills h3 span { font-family: var(--mono); font-size: 11px; color: var(--accent-ink); font-weight: 500; } /* شماره دسته */
    .skills li { padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--muted); } /* هر مهارت */
    .two { display: grid; gap: 40px; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); margin-top: 56px; } /* دستاوردها و علایق */
    .two h3 { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 14px; } /* عنوان کوچک */
    .wins li { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 15.5px; } /* هر دستاورد: سال + متن */
    .wins li span:first-child { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); padding-top: 3px; } /* سال */
    .interests { display: flex; flex-wrap: wrap; gap: 10px; }        /* برچسب‌های علایق */
    .interests li { padding: 9px 16px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 15px; transition: border-color .25s, transform .25s; } /* هر علاقه */
    .interests li:hover { border-color: var(--ink); transform: translateY(-2px) rotate(-1.5deg); } /* هاور علاقه */

    /* ───── بخش تماس (همیشه تیره) ───── */
    .contact { background: #0A0B10; color: #F1EDE3; position: relative; overflow: hidden; padding-bottom: 0; } /* پس‌زمینه تیره ثابت */
    .contact .eyebrow { color: #A9ABB4; } .contact .eyebrow b { color: #FF8D6F; } /* رنگ برچسب بالای تیتر */
    .contact .ph { border-color: #FF8D6F; }                          /* خط‌چین جایگزین‌ها */
    .contact-grid { display: grid; gap: clamp(36px, 5vw, 72px); grid-template-columns: minmax(0, 1fr); } /* موبایل: یک ستون */
    @media (min-width: 900px) { .contact-grid { grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); } } /* دسکتاپ: دو ستون */
    .contact .h2 { font-size: clamp(2.4rem, 6.4vw, 5rem); margin: 18px 0 22px; } /* تیتر بزرگ‌تر */
    .contact .h2 em { font-style: normal; color: #FF8D6F; }          /* کلمه رنگی در تیتر */
    .contact .lead { color: #B4B6BE; max-width: 52ch; }              /* متن توضیح */
    .mail { direction: ltr; unicode-bidi: isolate; display: inline-block; margin-top: 30px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: clamp(1.3rem, 3.4vw, 2.1rem); border-bottom: 3px solid #FF6A45; padding-bottom: 4px; transition: color .25s; word-break: break-all; } /* ایمیل بزرگ (همیشه چپ‌به‌راست) */
    .mail:hover { color: #FF8D6F; }                                  /* هاور ایمیل */
    .contact .cta { margin-top: 28px; }                              /* فاصله دکمه‌ها */
    .contact .btn { color: #F1EDE3; border-color: rgba(241,237,227,.45); } /* دکمه‌های روی زمینه تیره */
    .contact .btn:hover { background: #F1EDE3; color: #0A0B10; border-color: #F1EDE3; } /* هاور دکمه */
    .contact .btn-primary { background: #FF6A45; border-color: #FF6A45; color: #14130F; } /* دکمه اصلی */
    .contact .btn-primary:hover { background: #F1EDE3; border-color: #F1EDE3; color: #14130F; } /* هاور دکمه اصلی */
    .status { min-height: 24px; margin-top: 14px; font-family: var(--mono); font-size: 12px; color: #A9ABB4; } /* پیام کپی/دانلود */
    .social h3 { font-family: var(--mono); font-size: 12px; color: #A9ABB4; font-weight: 500; margin-bottom: 8px; } /* عنوان «شبکه‌های اجتماعی» */
    .social a { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid rgba(241,237,227,.16); font-family: var(--display); font-weight: 700; font-size: 1.15rem; transition: padding .3s, color .25s; } /* هر ردیف شبکه اجتماعی */
    .social a:hover { padding-inline-start: 10px; color: #FF8D6F; }  /* هاور */
    .s-main { display: flex; align-items: center; gap: 14px; }       /* آیکون + نام */
    .s-main .ic { width: 24px; height: 24px; }                       /* اندازه آیکون شبکه */
    .social small { display: block; direction: ltr; text-align: start; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 11.5px; color: #A9ABB4; } /* آی‌دی کاربری (انگلیسی) */
    .foot { margin-top: clamp(56px, 8vw, 96px); padding: 24px 0 30px; border-top: 1px solid rgba(241,237,227,.16); display: flex; flex-wrap: wrap; gap: 14px 28px; justify-content: space-between; align-items: center; font-size: 14px; color: #A9ABB4; } /* فوتر */
    .foot a { color: #F1EDE3; font-weight: 600; }                    /* لینک‌های فوتر */
    .foot a:hover { color: #FF8D6F; }                                /* هاور لینک فوتر */
    .foot-social { display: flex; gap: 10px; }                       /* ردیف آیکون‌های شبکه در فوتر */
    .foot-social a { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(241,237,227,.3); border-radius: 50%; transition: background-color .25s, color .25s; } /* دکمه گرد آیکون */
    .foot-social a:hover { background: #F1EDE3; color: #0A0B10; }    /* هاور آیکون */
    .kerf-deco { position: absolute; inset-inline-end: -80px; top: -60px; width: 420px; opacity: .3; pointer-events: none; } /* طرح تزئینی گوشه */
    .contact .wrap { position: relative; z-index: 1; }               /* محتوا روی طرح تزئینی */

    @media (prefers-reduced-motion: reduce) {                         /* کاربرانی که انیمیشن نمی‌خواهند */
      *, *::before, *::after { animation: none !important; transition: none !important; } /* همه انیمیشن‌ها خاموش */
      .layer { opacity: 1; }                                          /* ولی لایه‌های هیرو دیده شوند */
    }
    
    .portrait {
      position: relative;
    }

    .portrait-frame {
      position: relative;
      overflow: visible;
      border-radius: 22px;
      background: var(--surface);
      border: 1.5px solid var(--ink);
      box-shadow: 18px 18px 0 var(--accent);
    }

    .portrait-photo {
      display: block;
      width: 100%;
      aspect-ratio: 372 / 472;
      object-fit: cover;
      border-radius: 20px;
      border: 4px solid white;
      box-sizing: border-box;
    }

  
    /* ───── نوار درصد مهارت‌ها ───── */

    .sk-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; } /* ردیف نام مهارت و درصد */

      const box = $('m-box'), el = $('modal');                         // عناصر پنجره
      modal.id = id;                                                   // ثبت پروژه باز
      $('m-view').innerHTML = viewerHTML(it);                          // نمایشگر
      $('m-info').innerHTML = infoHTML(it, idx, list.length);          // اطلاعات
      if (el.hidden) { modal.last = document.activeElement; el.hidden = false; document.body.style.overflow = 'hidden'; } // اولین باز شدن: قفل اسکرول صفحه
      box.scrollTop = 0; box.focus();                                  // بالای پنجره و فوکوس
      if (typeOf(it) === 'model3d' && it.model) {                      // نوع سه‌بعدی
        const mv = $('m-view').querySelector('model-viewer'), fail = () => { const f = $('m-view').querySelector('.mv-fail'); if (f) f.hidden = false; }; // نمایش خطا
        if (mv) mv.addEventListener('error', fail);                    // خطای فایل مدل
        loadMV().catch(fail);                                          // خطای بارگذاری کتابخانه
      }
    }
    function closeProject() {                                          // بستن پنجره
      const el = $('modal'); if (el.hidden) return;                    // اگر باز نبود
      el.hidden = true; $('m-view').innerHTML = ''; modal.id = null;   // پاک کردن محتوا (ویدیو و مدل متوقف می‌شوند)
      document.body.style.overflow = '';                               // آزاد کردن اسکرول
      if (modal.last && modal.last.focus) modal.last.focus();          // برگرداندن فوکوس
    }
    function refreshModal() { if (modal.id && !$('modal').hidden) openProject(modal.id); } // با تغییر زبان، پنجره باز دوباره ساخته شود
    function galSet(g, i) {                                            // رفتن به عکس شماره i در گالری
      const th = [].slice.call(g.querySelectorAll('[data-g]')), n = th.length; if (!n) return; // تصاویر کوچک
      i = (i + n) % n; g.dataset.i = i;                                // چرخشی
      g.querySelector('.gal-main img').src = th[i].dataset.src;        // عکس بزرگ
      th.forEach((b, k) => b.classList.toggle('on', k === i));         // علامت انتخاب
      const c = g.querySelector('.gal-count'); if (c) c.textContent = num(i + 1) + ' / ' + num(n); // شماره
      th[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });   // دیده شدن تصویر کوچک
    }

    /* ───────── ۹) اعمال زبان و تم ───────── */
    function renderSkills() {                                          // ساخت نوار مهارت‌ها از آرایه SKILLS
      $('skills').innerHTML = SKILLS.map((g, gi) =>                    // برای هر دسته مهارت
        `<div><h3><span>${esc(pick(g.title))}</span><span>0${gi + 1}</span></h3><ul>` + g.items.map((it) => { // عنوان دسته + شماره
          const lv = Math.max(0, Math.min(100, Number(it.level) || 0)); // درصد را بین ۰ و ۱۰۰ نگه می‌دارد
          const gold = lv >= 100;                                      // اگر ۱۰۰ بود حالت طلایی
          return `<li class="${gold ? 'sk-gold' : ''}"><div class="sk-row"><span class="sk-name">${esc(pick(it.name))}</span><span class="sk-pct">${lv.toLocaleString(state.lang === 'fa' ? 'fa-IR' : 'en')}%</span></div>` + // نام + عدد درصد
            `<div class="sk-track" role="progressbar" aria-valuenow="${lv}" aria-valuemin="0" aria-valuemax="100"><div class="sk-fill" data-w="${lv}" style="${it.color ? '--c:' + esc(it.color) : ''}">${gold ? '<i></i><i></i><i></i><i></i><i></i>' : ''}</div></div></li>`; // نوار + ذره‌های طلایی
        }).join('') + '</ul></div>').join('');                        // بستن دسته و جایگذاری در صفحه
      const fill = () => document.querySelectorAll('.sk-fill').forEach((f) => { f.style.width = f.dataset.w + '%'; }); // پر کردن نوارها تا درصد هدف
      if ('IntersectionObserver' in window) {                          // اگر مرورگر پشتیبانی کند
        const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { fill(); io.disconnect(); } }, { threshold: .2 }); // وقتی بخش دیده شد، انیمیشن پر شدن شروع شود
        io.observe($('skills'));                                       // مشاهده بخش مهارت‌ها
      } else { fill(); }                                               // مرورگر قدیمی: مستقیم پر شود
    }
    function applyLang() {                                             // تغییر کامل زبان صفحه
      const L = state.lang, T = UI[L];                                 // زبان و متن‌های آن
      root.lang = L;                                                   // ویژگی lang صفحه
      root.dir = L === 'fa' ? 'rtl' : 'ltr';                           // جهت: فارسی راست‌به‌چپ، انگلیسی چپ‌به‌راست
      document.title = T.title;                                        // عنوان تب
      document.querySelectorAll('[data-fa]').forEach((el) => { el.innerHTML = el.getAttribute('data-' + L); }); // همه متن‌های ثابت صفحه
      document.querySelectorAll('[data-fa-label]').forEach((el) => { el.setAttribute('aria-label', el.getAttribute('data-' + L + '-label')); }); // aria-label های دو زبانه
      $('lang-label').textContent = T.langBtn;                         // برچسب دکمه زبان
      $('lang-btn').setAttribute('aria-label', T.langAria);            // توضیح دکمه زبان
      $('theme-btn').setAttribute('aria-label', state.theme === 'dark' ? T.toLight : T.toDark); // توضیح دکمه تم
      renderFilters(); renderDiscs(); renderBand(); renderSocial(); renderSkills(); renderProjects(); refreshModal(); // بازسازی بخش‌های پویا
      $('status').textContent = '';                                    // پیام وضعیت قبلی پاک شود
    }
    function applyTheme() {                                            // اعمال تم
      root.setAttribute('data-theme', state.theme);                    // ویژگی data-theme که CSS از آن استفاده می‌کند
      $('theme-btn').setAttribute('aria-label', state.theme === 'dark' ? UI[state.lang].toLight : UI[state.lang].toDark); // به‌روزرسانی توضیح دکمه
    }

    /* ───────── ۱۰) رویدادها ───────── */
    $('lang-btn').addEventListener('click', () => {                    // کلیک روی دکمه زبان
      state.lang = state.lang === 'fa' ? 'en' : 'fa';                  // جابه‌جایی بین فارسی و انگلیسی
      store.set('portfolio-lang', state.lang);                         // ذخیره انتخاب بازدیدکننده
      applyLang();                                                     // اعمال زبان جدید
    });
    $('theme-btn').addEventListener('click', () => {                   // کلیک روی دکمه تم
      state.theme = state.theme === 'dark' ? 'light' : 'dark';         // جابه‌جایی تیره/روشن
      store.set('portfolio-theme', state.theme);                       // ذخیره انتخاب
      applyTheme();                                                    // اعمال تم
    });
    $('menu-btn').addEventListener('click', () => {                    // کلیک روی دکمه منوی موبایل
      const open = $('site-nav').getAttribute('data-open') !== 'true'; // وضعیت جدید
      $('site-nav').setAttribute('data-open', open);                   // نمایش/مخفی کردن منو
      $('menu-btn').setAttribute('aria-expanded', open);               // به‌روزرسانی دسترس‌پذیری
    });
    $('site-nav').addEventListener('click', (e) => {                   // کلیک روی لینک‌های منو
      if (e.target.closest('a')) { $('site-nav').setAttribute('data-open', 'false'); $('menu-btn').setAttribute('aria-expanded', 'false'); } // منو بسته شود
    });
    $('filters').addEventListener('click', (e) => {                    // کلیک روی دکمه‌های فیلتر (event delegation)
      const b = e.target.closest('.chip'); if (!b) return;            // اگر روی دکمه نبود، خروج
      state.filter = b.dataset.key; renderFilters(); renderProjects(); // تنظیم فیلتر و رسم دوباره
    });
    $('disc-list').addEventListener('click', (e) => {                  // کلیک روی رشته‌ها در هیرو
      const a = e.target.closest('.disc'); if (!a) return;            // اگر روی لینک نبود، خروج
      state.filter = a.dataset.key; renderFilters(); renderProjects(); // همان فیلتر را اعمال کن (اسکرول را خود لینک انجام می‌دهد)
    });
    $('grid').addEventListener('click', (e) => {                       // کلیک روی کارت‌ها
      const b = e.target.closest('[data-open]'); if (b) openProject(b.dataset.open); // باز کردن پروژه
    });
    $('modal').addEventListener('click', (e) => {                      // کلیک‌ها داخل پنجره (event delegation)
      if (e.target.closest('[data-close]')) { closeProject(); return; } // دکمه بستن، پرده یا لینک تماس
      const pn = e.target.closest('[data-pn]');                        // قبلی/بعدی پروژه
      if (pn) { const l = visibleList(), i = l.findIndex((x) => x.id === modal.id); if (l.length) openProject(l[(i + Number(pn.dataset.pn) + l.length) % l.length].id); return; } // چرخشی
      const g = e.target.closest('.gal'); if (!g) return;              // کلیک داخل گالری؟
      const th = e.target.closest('[data-g]'), gd = e.target.closest('[data-gd]'); // تصویر کوچک یا فلش
      if (th) galSet(g, Number(th.dataset.g)); else if (gd) galSet(g, Number(g.dataset.i) + Number(gd.dataset.gd)); // تغییر عکس
    });
    $('modal').addEventListener('input', (e) => {                      // حرکت لغزنده قبل/بعد
      const c = e.target.closest('.cmp'); if (c) c.style.setProperty('--p', e.target.value + '%'); // موقعیت خط جداکننده
    });
    document.addEventListener('keydown', (e) => {                      // کلیدهای کیبورد
      const el = $('modal'); if (el.hidden) return;                    // فقط وقتی پنجره باز است
      if (e.key === 'Escape') { closeProject(); return; }              // Esc = بستن
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const g = $('m-view').querySelector('.gal'); if (g) galSet(g, Number(g.dataset.i) + (e.key === 'ArrowRight' ? 1 : -1)); } // فلش‌ها = تغییر عکس
      if (e.key === 'Tab') {                                           // نگه داشتن فوکوس داخل پنجره
        const f = [].slice.call(el.querySelectorAll('button, a[href], input, iframe, video[controls]')).filter((x) => !x.disabled && x.offsetParent !== null); // عناصر قابل فوکوس
        if (!f.length) return;                                         // اگر چیزی نبود
        if (e.shiftKey && document.activeElement === f[0]) { f[f.length - 1].focus(); e.preventDefault(); } // از اولی به آخری
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { f[0].focus(); e.preventDefault(); } // از آخری به اولی
      }
    });
    checkItems();                                                      // بررسی فرم پروژه‌ها و هشدار در کنسول
    $('copy-btn').addEventListener('click', () => {                    // کپی ایمیل
      const T = UI[state.lang];                                        // متن‌ها
      try { navigator.clipboard.writeText(SITE.email).then(() => { $('status').textContent = T.copied; }, () => { $('status').textContent = T.copyFail; }); } // اگر موفق بود پیام کپی
      catch (e) { $('status').textContent = T.copyFail; }              // اگر مرورگر اجازه نداد پیام خطا
    });
    $('resume-btn').addEventListener('click', () => {                  // دانلود رزومه نمونه
      const T = UI[state.lang];                                        // متن‌ها
      try {
        const url = URL.createObjectURL(new Blob(['\uFEFF' + T.resume.join('\n')], { type: 'text/plain;charset=utf-8' })); // ساخت فایل متنی موقت (BOM برای فارسی)
        const a = document.createElement('a');                         // لینک موقت دانلود
        a.href = url; a.download = 'resume-placeholder.txt';           // نام فایل دانلودی
        document.body.appendChild(a); a.click(); a.remove();           // کلیک خودکار و پاک کردن لینک
        setTimeout(() => URL.revokeObjectURL(url), 1500);              // آزاد کردن حافظه
        $('status').textContent = T.dl;                                // پیام موفقیت
      } catch (e) { $('status').textContent = T.dlFail; }              // پیام خطا
      // برای رزومه واقعی: به‌جای این تابع، در HTML دکمه را به <a href="resume.pdf" download> تبدیل کنید
    });

    /* ───────── ۱۱) شروع برنامه ───────── */
    $('mail-link').href = 'mailto:' + SITE.email;                      // لینک ایمیل بزرگ
    $('mail-link').textContent = SITE.email;                           // متن ایمیل
    $('mail-btn').href = 'mailto:' + SITE.email + '?subject=Project%20enquiry'; // دکمه ارسال ایمیل با موضوع آماده
    const sl = store.get('portfolio-lang'), st = store.get('portfolio-theme'); // خواندن انتخاب‌های ذخیره‌شده
    if (sl === 'fa' || sl === 'en') state.lang = sl;                   // اگر زبان ذخیره شده بود از آن استفاده کن
    if (st === 'light' || st === 'dark') state.theme = st;             // اگر تم ذخیره شده بود از آن استفاده کن
    applyTheme();                                                      // اعمال تم
    applyLang();                                                       // اعمال زبان و ساخت کل صفحه
  })();
  /* ═════════ پایان جاوااسکریپت ═════════ */
  </script>
</body>
</html>
